<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWFTech | Under Construction</title>
    <style>
        :root {
            --primary-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-blue: #0284c7;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            background-color: rgba(2, 132, 199, 0.1);
            color: var(--accent-blue);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2.25rem;
            margin: 0 0 1rem 0;
            font-weight: 800;
        }

        p {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0 0 0.5rem 0;
        }

        a {
            color: var(--accent-blue);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">Under Construction</span>
        <h1>SWFTech</h1>
        <p>We're rebuilding this site. Check back soon.</p>
    </div>

</body>
</html>
