<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6a64">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zion Trip">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Zion Trip Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column. Home = trip strip + day list + four tiles. Tap a row to open its detail view (hash-routed). */
:root{
  --bg:#f3efec; --surface:#fffdfb; --ink:#2a2320; --muted:#6f625b; --line:#e3d9d2; --accent:#1f6a64;
  --vegas:#5d5a8e; --bryce:#d2703f; --zion:#a9433a; --rental:#61814f; --fire:#8a2c1e; --home:#7d7470;
  --warn-bg:#fbeadc; --warn-ink:#7a3a12;
  --f-display:"Zilla Slab",Rockwell,"Roboto Slab",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1513; --surface:#241e1b; --ink:#f1e8e2; --muted:#b2a39a; --line:#3a312c; --accent:#6cc0b4;
  --vegas:#9d99d6; --bryce:#ee9565; --zion:#e0766a; --rental:#9dbd88; --fire:#e2684f; --home:#b3aaa5;
  --warn-bg:#3a2519; --warn-ink:#f3c09c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1513; --surface:#241e1b; --ink:#f1e8e2; --muted:#b2a39a; --line:#3a312c; --accent:#6cc0b4;
  --vegas:#9d99d6; --bryce:#ee9565; --zion:#e0766a; --rental:#9dbd88; --fire:#e2684f; --home:#b3aaa5;
  --warn-bg:#3a2519; --warn-ink:#f3c09c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Hero */
.hero{display:grid;gap:6px;padding-block:8px 18px}
.hero h1{font-size:clamp(36px,10vw,52px);font-weight:700;letter-spacing:-.01em}
.hero .sub{color:var(--muted);font-size:15px}
.kicker{font-family:var(--f-display);font-weight:500;font-size:clamp(20px,5.5vw,26px);color:var(--muted);line-height:1.1}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}

/* Route strip: one segment per night, colored by where you sleep */
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-block:4px 6px}
.strip span{height:10px;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}

/* Day list */
.days{list-style:none;margin:22px 0 0;padding:0;border-top:1px solid var(--line)}
.day{border-bottom:1px solid var(--line)}
.day button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;width:100%;padding:14px 4px}
.day button:hover .t{color:var(--accent)}
.date{display:grid;justify-items:center;line-height:1}
.date b{font-family:var(--f-display);font-size:28px;font-weight:700}
.date small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.t{font-weight:600;font-size:16px;min-width:0}
.where{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.chev{color:var(--muted);font-size:20px}
.day.today{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.day.today .date small{color:var(--accent);font-weight:700}
.day.muted .t{color:var(--muted);font-weight:500}

/* Tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:2px}
.tile:hover{border-color:var(--accent)}
.tile b{font-family:var(--f-display);font-size:19px}
.tile span{font-size:13px;color:var(--muted)}

/* Detail views */
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:15px;padding:6px 0}
.dhead{display:grid;gap:4px;padding-block:10px 16px;border-bottom:3px solid var(--band,var(--line))}
.dhead h2{font-size:clamp(28px,8vw,38px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted);background:var(--surface)}
.chip.tz{font-family:var(--f-mono)}
section{margin-top:22px}
section > h3{font-size:14px;font-family:var(--f-body);font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.stay{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.stay b{font-size:16px}
.stay .conf{font-size:13px;color:var(--muted)}

.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.tl li:first-child{border-top:0}
.tl .time{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.tl .what{min-width:0}
.tl .what b{font-weight:600}
.tl .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.tl .meta span{font-family:var(--f-mono);font-size:12px;color:var(--ink);background:color-mix(in srgb,var(--band,var(--accent)) 14%,transparent);border-radius:4px;padding:1px 7px}
.tl .note{font-size:14px;color:var(--muted);margin-top:3px}
.tl .what a{font-size:14px}
.notime li,.opt li{grid-template-columns:1fr}.notime .time,.opt .time{display:none}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 14px}
.flag{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 12px;font-size:14px}
.flag + .flag{margin-top:8px}

table{width:100%;border-collapse:collapse;font-size:15px}
.lodges{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.lodge{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:12px 2px;border-bottom:1px solid var(--line)}
.ld{display:grid;align-content:start;gap:2px}.ld b{font-family:var(--f-mono);font-size:14px;font-weight:500;white-space:nowrap}.lw .mono{font-size:14px}.ld small{font-size:12px;color:var(--muted)}
.lw{min-width:0;display:grid;justify-items:start;gap:3px}.lw b{font-size:16px}.lw .note{font-size:14px;color:var(--muted)}.lw a{font-size:14px}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:1px 9px}.pill.ok{background:color-mix(in srgb,var(--rental) 22%,transparent);color:var(--ink)}.pill.todo{background:var(--warn-bg);color:var(--warn-ink)}
td,th{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:600;border-bottom:0}
.tscroll{overflow-x:auto}

.checks{list-style:none;margin:0;padding:0}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.checks input{flex:none;margin-top:2px;width:20px;height:20px;accent-color:var(--accent)}
.checks span small{display:block;font-size:13px;color:var(--muted)}
.pc{font-family:var(--f-mono);letter-spacing:0;text-transform:none;font-weight:400;margin-left:6px}
.tip{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:15px}
.checks input:checked + span{text-decoration:line-through;color:var(--muted)}

.links{list-style:none;margin:0;padding:0}
.links li{border-bottom:1px solid var(--line)}
.links a{display:flex;justify-content:space-between;gap:12px;padding:13px 4px;text-decoration:none;color:var(--ink)}
.links a span{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
.links a:hover b{color:var(--accent)}

.foot{margin-top:34px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){#view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>


<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head><body>
<main class="wrap" id="view"></main>

<script>
const UPDATED="Sep 30, 2026, 4:35 pm CT"; // bump on every content change
const R = { // regions
  vegas:{name:"Las Vegas",c:"--vegas"}, bryce:{name:"Bryce Canyon",c:"--bryce"}, zion:{name:"Zion",c:"--zion"},

};
const L = {
  zionLodge:["Zion Lodge","https://www.zionlodge.com/"],
  cable:["Cable Mountain Lodge","https://cablemountainlodge.com/"],

  cowboys:["Cowboys & Angels Speakeasy","https://www.cowboysandangelszion.com/"],
  springs:["Zion Canyon Hot Springs","https://www.zioncanyonhotsprings.com/hot-springs-pools"],

const DAYS = [
 {n:1,d:"2026-10-03",r:"vegas",title:"Fly in",tz:"Nevada · PDT",
  stay:{name:"Vegas hotel",conf:"Not booked yet"},
  items:[{t:"9:34 am",w:"Champagne land in Vegas",n:"JetBlue B6 1577, departs 6:50 am"},{t:"5:00 pm",w:"Freimillers land in Vegas",n:"Delta from Louisville via Atlanta"},{w:"Fausz arrival",n:"Not in the sheet yet"},{w:"Overnight in Vegas"}],
  notes:["Vegas is 1 hour behind Bryce and Zion."]},
 {n:2,d:"2026-10-04",r:"bryce",title:"Drive to Bryce",tz:"Utah · MDT",

   {t:"2:15–3:30",w:"Bristlecone Loop",m:["1 mi","easy","30–60 min"]},

  stay:{name:"Zion Lodge",conf:"Booked (Champagne) · night 1 of 3",link:"zionLodge"},
  items:[
   {t:"7:30",w:"Breakfast at hotel",n:"Check out of Ruby's Inn before the ride (11 am check-out)"},

   {t:"12:00–1:00",w:"Lunch"},

  optTitle:"Other things to do in Bryce",

   {w:"Queens Garden Trail",m:["moderate","1–2 hr"],n:"Steep climb back up."}]},
 {n:4,d:"2026-10-06",r:"zion",title:"Emerald Pools and e-bikes",tz:"Utah · MDT",
  stay:{name:"Zion Lodge",conf:"Night 2 of 3",link:"zionLodge"},
  items:[
   {t:"Morning",w:"Emerald Pool Trail from Zion Lodge",m:["2.2 mi RT","easy","~2 hr"]},
   {t:"Afternoon",w:"E-bike Zion Scenic Drive",m:["30 mi RT","~4 hr"],link:"outfitter"},
   {t:"Late",w:"Return bikes, pick up Narrows gear",n:"Zion Outfitter",link:"outfitter"}]},

  stay:{name:"Zion Lodge",conf:"Night 3 of 3",link:"zionLodge"},

  stay:{name:"Vegas hotel (Freimillers only)",conf:"Not booked yet"}},
 {n:0,d:"2026-10-12",r:"home",title:"Columbus Day: recovery",muted:true,items:[{t:"12:31 pm",w:"Freimillers fly home",n:"Delta 748 to Atlanta, then Delta 2842 to Louisville, arriving 10:35 pm"},{w:"Recovery :)"}]}

const EXTRAS=[["Narrows gear (Zion Outfitter)","$60 per person"],["E-bike rental (Zion Outfitter)","$79 per person"],["Horseback ride","$125 per person, 3 hr"],["Zion Hot Springs","$70 per person, 3 hr"],["America the Beautiful Pass","$0"]];
const PACK_TIP="Dress in layers. Wear the same outer layers every day, because it warms up fast once the sun comes out.";
const PACK=[

 {g:"Clothes",items:[

  ["Light layer: long-sleeve tees, Cuddl Duds or sun shirts"],
  ["Warm layer: light fleece or sweatshirt"],
  ["Outer layer: wind/rain shell and a puffer coat"],
  ["Gloves and a beanie","For sunrises"],
  ["Undergarments"],["PJs"],
  ["Socks","Bring extras"],
  ["Swimsuit and cover-up"],
  ["Dinner outfits","Jeans and nicer T-shirts. Just a couple."]]},
 {g:"Shoes",items:[["Sneakers"],["Hiking shoes with good tread"],["Dinner sandals or shoes"],["Flip-flops"]]},
 {g:"Daypack",items:[
  ["Headlamp","Use the red light to avoid light pollution"],
  ["Water: two or three 32 oz bottles each, or a CamelBak"],
  ["Electrolytes"],
  ["WAG bag"],
  ["Baggies with single-use TP or wipes","Pack a couple"],
  ["Multi-purpose tool"],
  ["Travel snacks: nuts, bars"]]},
 {g:"Gear",items:[["Hat"],["Sunglasses"],["Hiking poles"],["Dry bag for your phone"],["Dry bag for the Narrows"],["Wet bag for your swimsuit, plus a hanger to dry it"],["Frogg Toggs"],["Hot Hands"],["Insulated bottle"],["Coffee mug"],["Headphones"],["External charger packs"],["Baggies"],["Trash bags"]]},
 {g:"Health & first aid",items:[["Sunscreen"],["Lip balm with sunscreen"],["Small first aid kit"],["Tylenol"],["Medication"],["Hand sanitizer"],["Small bug spray or wipes"],["Antibacterial wipes"],["Eye drops"],["Nose drops"],["Throat lozenges"],["Tissues"],["Lotion"]]},
 {g:"Personal & travel",items:[["Personal hygiene items"],["Hygiene wipes"],["Makeup"],["Mints"],["Gum"],["Tide and dryer sheets"],["Travel pillow"],["Plug-in headphones for the plane"],["Sleep mask"],["Book"]]}
];
const PACK_N=PACK.reduce((a,g)=>a+g.items.length,0);

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=(s,o)=>dt(s).toLocaleDateString("en-US",o);
const todayStr=(()=>{const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`})();
const col=r=>`var(${R[r].c})`;
const link=k=>{const [a,h]=L[k];return `<a href="${h}" target="_blank" rel="noopener">${esc(a)} ↗</a>`};

function home(){
  const trip=DAYS.filter(d=>!d.muted);
  const strip=trip.map(d=>`<span style="background:${col(d.r)}" title="${esc(R[d.r].name)}"></span>`).join("");
  const used=[...new Set(trip.map(d=>d.r))];
  $("#view").innerHTML=`
  <header class="hero">
    <div class="kicker">Fausz, Freimiller &amp;</div>
    <h1>Champagne on the Rocks</h1>
    <div class="sub">Bryce · Zion · Valley of Fire<br>Oct 3–11, 2026 · In and out of Vegas</div>
    <div class="count">Updated ${UPDATED}</div>
  </header>
  <div class="strip" aria-hidden="true">${strip}</div>
  <div class="legend">${used.map(r=>`<span><i style="background:${col(r)}"></i>${R[r].name}</span>`).join("")}</div>
  <ol class="days">${DAYS.map(d=>`
    <li class="day${d.d===todayStr?" today":""}${d.muted?" muted":""}">
      <button data-go="day${d.n||"x"}">
        <span class="date"><b>${dt(d.d).getDate()}</b><small>${d.d===todayStr?"Today":fmt(d.d,{weekday:"short"})}</small></span>
        <span style="min-width:0"><div class="t">${esc(d.title)}</div>
          <div class="where"><span class="dot" style="background:${col(d.r)}"></span>${d.n?`Day ${d.n} · `:""}${d.stay?"Sleep: "+esc(d.stay.name):R[d.r].name}</div></span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
    </li>`).join("")}</ol>
  <div class="tiles">
    <button class="tile" data-go="stays"><b>Stays &amp; travel</b><span>Hotels, flights, car</span></button>
    <button class="tile" data-go="costs"><b>Costs</b><span>Activity prices</span></button>
    <button class="tile" data-go="packing"><b>Packing</b><span>${PACK_N} items, Monica's list</span></button>
    <button class="tile" data-go="links"><b>Links</b><span>${Object.keys(L).length} places</span></button>
  </div>
  <p class="foot">Built from the Zion trip spreadsheet. Items marked TBD aren't filled in there yet.</p>`;
}
const back=`<button class="back" data-go="">‹ All days</button>`;
function item(i){
  return `<li><div class="time">${i.t?esc(i.t):""}</div><div class="what"><b>${esc(i.w)}</b>
    ${i.m?`<div class="meta">${i.m.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}
    ${i.n?`<div class="note">${esc(i.n)}</div>`:""}
    ${i.link?`<div>${link(i.link)}</div>`:""}${i.links?`<div class="chips" style="gap:4px 12px">${i.links.map(link).join("")}</div>`:""}</div></li>`;
}
function day(n){
  const d=DAYS.find(x=>String(x.n||"x")===n); if(!d) return home();
  const i=DAYS.indexOf(d), prev=DAYS[i-1], next=DAYS[i+1];
  $("#view").style.setProperty("--band",col(d.r));
  $("#view").innerHTML=`${back}
  <div class="dhead">
    <div class="eyebrow">${d.n?`Day ${d.n} · `:""}${fmt(d.d,{weekday:"long",month:"long",day:"numeric"})}</div>
    <h2>${esc(d.title)}</h2>
    <div class="chips"><span class="chip">${R[d.r].name}</span>${d.tz?`<span class="chip tz">${d.tz}</span>`:""}</div>
  </div>
  ${d.notes?`<section>${d.notes.map(x=>`<div class="flag">${esc(x)}</div>`).join("")}</section>`:""}
  <section><h3>Plan</h3><ul class="tl${d.items.some(x=>x.t)?"":" notime"}">${d.items.map(item).join("")}</ul></section>
  ${d.options?`<section><h3>${esc(d.optTitle||"If there's time")}</h3><ul class="tl opt">${d.options.map(item).join("")}</ul></section>`:""}
  ${d.stay?`<section><h3>Tonight</h3><div class="stay"><b>${esc(d.stay.name)}</b><span class="conf">${esc(d.stay.conf)}</span>${d.stay.link?link(d.stay.link):""}</div></section>`:""}
  <section class="chips" style="justify-content:space-between">
    ${prev?`<button class="back" data-go="day${prev.n||"x"}">‹ ${esc(fmt(prev.d,{weekday:"short",month:"short",day:"numeric"}))}</button>`:"<span></span>"}
    ${next?`<button class="back" data-go="day${next.n||"x"}">${esc(fmt(next.d,{weekday:"short",month:"short",day:"numeric"}))} ›</button>`:""}
  </section>`;
}
function stays(){
  const groups=[];DAYS.filter(d=>d.stay).forEach(d=>{const g=groups[groups.length-1];if(g&&g.name===d.stay.name&&g.link===d.stay.link){g.days.push(d)}else groups.push({name:d.stay.name,link:d.stay.link,conf:d.stay.conf,days:[d]})});
  const md=s=>fmt(s,{month:"short",day:"numeric"});
  const rows=groups.map(g=>{const a=g.days[0],z=g.days[g.days.length-1],n=g.days.length;
    const raw=g.conf.replace(/\s*·?\s*night \d+ of \d+/i,"").trim();const booked=/^booked/i.test(raw);
    const detail=raw.replace(/^(booked|not booked yet)\s*·?\s*/i,"").replace(/^\((.*)\)\s*·?\s*/,"$1 · ").replace(/\s*·\s*$/,"");
    return `<li class="lodge"><div class="ld"><b>${n>1?`${md(a.d)}–${dt(z.d).getDate()}`:md(a.d)}</b><small>${fmt(a.d,{weekday:"short"})} · ${n} night${n>1?"s":""}</small></div>
      <div class="lw"><b>${esc(g.name)}</b><span class="pill ${booked?"ok":"todo"}">${booked?"Booked":"Not booked"}</span>${detail?`<div class="note">${esc(detail)}</div>`:""}${g.link?`<a href="${L[g.link][1]}" target="_blank" rel="noopener">Website ↗</a>`:""}</div></li>`}).join("");
  $("#view").innerHTML=`${back}<div class="dhead"><div class="eyebrow">Getting around</div><h2>Stays &amp; travel</h2></div>
  <section><h3>Lodging</h3><ul class="lodges">${rows}</ul></section>
  <section><h3>Flights</h3><ul class="lodges">
    <li class="lodge"><div class="ld"><b>Champagne</b></div><div class="lw"><div><span class="note">Arrive Sat Oct 3</span><br>JetBlue B6 1577<br><span class="mono">6:50 → 9:34 am</span></div><div><span class="note">Depart Sun Oct 11</span><br>Breeze MX527<br><span class="mono">10:01 am → 5:59 pm</span></div></div></li>
    <li class="lodge"><div class="ld"><b>Fausz</b></div><div class="lw"><span class="pill todo">Not in the sheet yet</span></div></li>
    <li class="lodge"><div class="ld"><b>Freimiller</b></div><div class="lw"><div><span class="note">Arrive Sat Oct 3</span><br>Delta 1481 + 659, Louisville via Atlanta<br><span class="mono">1:37 pm → 5:00 pm</span></div><div><span class="note">Depart Mon Oct 12</span><br>Delta 748 + 2842, via Atlanta<br><span class="mono">12:31 pm → 10:35 pm</span></div></div></li></ul></section>
  <section><h3>Rental car</h3><div class="stay"><b>Alamo, booked through Costco Travel</b><span class="conf">Pickup and drop-off details aren't in the sheet yet</span></div></section>
  <p class="foot">Confirmation numbers are kept in the trip spreadsheet, not on this public page.</p>`;
}
function costs(){
  $("#view").innerHTML=`${back}<div class="dhead"><div class="eyebrow">Prices from the sheet</div><h2>Activity costs</h2></div>
  <section><div class="tscroll"><table>${EXTRAS.map(r=>`<tr><td>${esc(r[0])}</td><td class="num">${esc(r[1])}</td></tr>`).join("")}</table></div></section>`;
}
function packing(){
  let saved={}; try{saved=JSON.parse(localStorage.getItem("zion-pack2")||"{}")}catch(e){}
  const key=(g,t)=>g+"|"+t;
  const done=g=>g.items.filter(([t])=>saved[key(g.g,t)]).length;
  $("#view").innerHTML=`${back}<div class="dhead"><div class="eyebrow">Monica's list · ${PACK_N} items</div><h2>Packing</h2></div>
  <section><div class="tip">${esc(PACK_TIP)}</div></section>
  ${PACK.map((g,gi)=>`<section><h3>${esc(g.g)} <span class="pc" id="pc${gi}">${done(g)}/${g.items.length}</span></h3><ul class="checks">${g.items.map(([t,n],i)=>`<li><label><input type="checkbox" id="pk${gi}_${i}" data-g="${gi}" data-k="${esc(key(g.g,t))}" ${saved[key(g.g,t)]?"checked":""}><span>${esc(t)}${n?`<small>${esc(n)}</small>`:""}</span></label></li>`).join("")}</ul></section>`).join("")}
  <p class="foot">Check marks are saved on this phone only.</p>`;
  document.querySelectorAll(".checks input").forEach(cb=>cb.addEventListener("change",()=>{saved[cb.dataset.k]=cb.checked;try{localStorage.setItem("zion-pack2",JSON.stringify(saved))}catch(e){}
    const g=PACK[cb.dataset.g];$("#pc"+cb.dataset.g).textContent=`${done(g)}/${g.items.length}`;}));
}
function links(){
  $("#view").innerHTML=`${back}<div class="dhead"><div class="eyebrow">Bookmarks</div><h2>Links</h2></div>
  <section><ul class="links">${Object.values(L).map(([a,h])=>`<li><a href="${h}" target="_blank" rel="noopener"><b>${esc(a)}</b><span>${esc(new URL(h).hostname.replace("www.",""))} ↗</span></a></li>`).join("")}</ul></section>`;
}
function route(){
  const h=location.hash.slice(1);
  $("#view").style.removeProperty("--band");
  if(h.startsWith("day")) day(h.slice(3));
  else ({stays,costs,packing,links}[h]||home)();
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(!b)return;e.preventDefault();const g=b.dataset.go;
  if(g) location.hash=g; else {history.pushState(null,"",location.pathname+location.search);route();}});
window.addEventListener("hashchange",route);
window.addEventListener("popstate",route);
route();
</script>

<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");</script>
</body></html>
